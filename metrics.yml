name: Generate GitHub Metrics

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate main GitHub metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          filename: profile/metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

      - name: Generate GitHub achievements
        uses: lowlighter/metrics@latest
        with:
          filename: profile/achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact

      - name: Generate contribution activity dashboard
        uses: lowlighter/metrics@latest
        with:
          filename: profile/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: activity, community
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
